<main class="page">
  <section class="products">
    <div class="header">
      <h1>Products</h1>
      <a pButton routerLink="/add-product" label="Add Product" icon="pi pi-plus"></a>
    </div>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <p-table
      #table
      [value]="products"
      [paginator]="true"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 20]"
      [globalFilterFields]="['name', 'price', 'quantity']"
    >
      <ng-template pTemplate="caption">
        <div class="search">
          <i class="pi pi-search"></i>
          <input
            #searchInput
            pInputText
            type="text"
            placeholder="Search by name, price or quantity"
            (input)="table.filterGlobal(searchInput.value, 'contains')"
          />
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">
            Name <p-sortIcon field="name" />
          </th>
          <th pSortableColumn="price">
            Price <p-sortIcon field="price" />
          </th>
          <th>Description</th>
          <th pSortableColumn="quantity">
            Quantity <p-sortIcon field="quantity" />
          </th>
          <th>Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-product>
        <tr>
          <td>{{ product.name }}</td>
          <td>{{ product.price }}</td>
          <td>{{ product.description || '-' }}</td>
          <td>{{ product.quantity }}</td>
          <td class="actions">
            <a
              pButton
              [routerLink]="['/edit-product', product.id]"
              label="Edit"
              icon="pi pi-pencil"
              severity="secondary"
              size="small"
            ></a>
            <p-button
              label="Delete"
              icon="pi pi-trash"
              severity="danger"
              size="small"
              (onClick)="deleteProduct(product)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5">No products found.</td>
        </tr>
      </ng-template>
    </p-table>

    <a routerLink="/">Back to main page</a>
  </section>
</main>
