<main class="page">
  <section class="products">
    <div class="header">
      <h1>Products</h1>
      <a pButton routerLink="/add-product" label="Add Product" icon="pi pi-plus"></a>
    </div>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <p-table [value]="products">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th>Description</th>
          <th>Quantity</th>
          <th>Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-product>
        <tr>
          <td>{{ product.name }}</td>
          <td>{{ product.price }}</td>
          <td>{{ product.description || '-' }}</td>
          <td>{{ product.quantity }}</td>
          <td class="actions">
            <a
              pButton
              [routerLink]="['/edit-product', product.id]"
              label="Edit"
              icon="pi pi-pencil"
              severity="secondary"
              size="small"
            ></a>
            <p-button
              label="Delete"
              icon="pi pi-trash"
              severity="danger"
              size="small"
              (onClick)="deleteProduct(product)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5">No products found.</td>
        </tr>
      </ng-template>
    </p-table>

    <a routerLink="/">Back to main page</a>
  </section>
</main>
