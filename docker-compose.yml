services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: SimacTest
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before running Docker Compose}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./SimacTest
    environment:
      DB_URL: jdbc:mysql://database:3306/SimacTest?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before running Docker Compose}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./SimacTestFront
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
